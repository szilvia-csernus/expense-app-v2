customHeaders:
  - pattern: "**"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "X-XSS-Protection"
        value: "1; mode=block"
  - pattern: "**/*.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.css"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.{png,jpg,jpeg,webp,svg,ico}"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.{woff,woff2,ttf}"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "*.html"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
  - pattern: "sw.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
  - pattern: "registerSW.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
  - pattern: "manifest.webmanifest"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=604800"
