customHeaders:
  - pattern: "**"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "X-Frame-Options"
        value: "DENY"
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains"
      - key: "Content-Security-Policy"
        value: "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.amazonaws.com; connect-src 'self' https://*.amazonaws.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'"
  - pattern: "**/*.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.css"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.{png,jpg,jpeg,webp,svg,ico}"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "**/*.{woff,woff2,ttf}"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - pattern: "*.html"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
  - pattern: "sw.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
  - pattern: "registerSW.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=0, must-revalidate"
  - pattern: "manifest.webmanifest"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=604800"
